[project]
name = "experiment-gatekeeper"
version = "0.1.0"
description = "Stops broken Flagsmith experiments before they start and unproven winners before they ship. CLI, MCP server and console."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "mcp>=1.2",
]

[project.optional-dependencies]
demo = ["flagsmith>=6.3.0", "flask>=3"]
dev = ["pytest>=8"]

[project.scripts]
gk = "gatekeeper.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["gatekeeper"]

[tool.setuptools.package-data]
gatekeeper = ["static/*"]
